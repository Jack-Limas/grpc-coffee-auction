name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint the contract
        run: npx buf lint
      - name: Generated code is up to date with the contract
        run: npx buf generate && git diff --exit-code packages/contracts/src/gen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:server
      - run: npm run build:web
